<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер markdown в html</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <button id="profileBtn">Профиль</button>
        <div id="profilePopup">
            <h3>Профиль</h3>
            <p>Имя пользователя: <span id="username"></span></p>
            <p>Email: <span id="email"></span></p>
            <button id="myDocumentsButton">Мои документы</button>
            <button id="logoutButton">Выйти</button>
        </div>
    </header>
    <div class="container" id="mainContainer">
        <div id="inputContainer">
            <textarea class="field" id="inputField" placeholder="Введите markdown текст..." required></textarea>
            <button id="fullscreenInputButton" class="fullscreenButton">⛶</button>
        </div>
        <div id="outputContainer">
            <div class="field" id="outputField"></div>
            <button id="fullscreenOutputButton" class="fullscreenButton">⛶</button>
        </div>
        <div class="fieldButtons">
            <button id="copyHtmlButton">Скопировать html</button>
            <button id="downloadHtmlButton">Скачать html страницу</button>
            <button id="saveInputButton">Сохранить</button>
            <button id="shareDocumentSettingsButton">Настройка доступа</button>

            <div id="permissionForm">
                <form id="accessForm">
                    <div>
                        <label for="email">Email пользователя:</label>
                        <input type="email" id="accessFormEmail" name="email" required placeholder="Введите email">
                    </div>
                    <div>
                        <label for="permission">Уровень доступа:</label>
                        <select id="permission" name="permission" required>
                            <option value="Read">Чтение</option>
                            <option value="Write">Запись</option>
                        </select>
                    </div>
                    <button type="submit">Предоставить доступ</button>
                </form>
            </div>

            <p id="messageField"></p>
            <button id="openFullscreenButton">Полноэкранный режим</button>
        </div>
        <div id="shareDocumentSettingsContainer">
            <span class="close" onclick="closeShareDocumentSettingsContainer()">×</span>
            <div>
                <h2 id="readAccessTitle">Пользователи с доступом для чтения</h2>
                <div id="readAccessUsers" class="gridContainer"></div>
            </div>

            <div>
                <h2 id="writeAccessTitle">Пользователи с доступом для редактирования</h2>
                <div id="writeAccessUsers" class="gridContainer"></div>
            </div>
            <p id="messageField"></p>
        </div>
    </div>
    <div id="documentGrid">
        <h2 id="myDocumentGridTitle"></h2>
        <div class="gridContainer" id="myDocumentGrid"></div>
        <h2 id="availableDocumentGridTitle"></h2>
        <div class="gridContainer" id="availableDocumentGrid"></div>
    </div>
    <div class="authContainer" id="authContainer">
        <span class="close" onclick="closeAuthContainer()">×</span>
        <h1>Войти или зарегистрироваться</h1>
        <div class="tabs">
            <button class="tabButton active" onclick="showForm('login')">Вход</button>
            <button class="tabButton" onclick="showForm('register')">Регистрация</button>
        </div>
        <form id="loginForm" class="form active">
            <label for="loginEmail">Email:</label>
            <input type="email" id="loginEmail" placeholder="Введите email" required>

            <label for="loginPassword">Пароль:</label>
            <input type="password" id="loginPassword" placeholder="Введите пароль" required>

            <button type="submit">Войти</button>
        </form>
        <form id="registerForm" class="form">
            <label for="registerEmail">Email:</label>
            <input type="email" id="registerEmail" placeholder="Введите email" required>

            <label for="registerUsername">Username:</label>
            <input type="text" id="registerUsername" placeholder="Придумайте никнейм" required>
            <small id="nameError" class="errorAuthMessage"></small>

            <label for="registerPassword">Пароль:</label>
            <input type="password" id="registerPassword" placeholder="Введите пароль" required>

            <label for="confirmPassword">Подтвердите пароль:</label>
            <input type="password" id="confirmPassword" placeholder="Повторите пароль" required>

            <button type="submit">Зарегистрироваться</button>
        </form>
        <p id="errorAuthMessage" class="errorAuthMessage"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
